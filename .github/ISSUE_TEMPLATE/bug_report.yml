name: Bug report
description: Report a reproducible problem in AURA Hub
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please redact API keys, PINs, tokens, conversation
        content, and personal data before submitting.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the behavior and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Numbered steps, including the workspace used if relevant.
      placeholder: |
        1. Open FAMILY workspace
        2. Go to ...
        3. Observe ...
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: AURA Hub version
      description: App version from Settings → About, or the release tag.
      placeholder: v0.1.0
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Windows x64 portable
        - Windows source build
        - Web
        - Other
    validations:
      required: true

  - type: input
    id: flutter
    attributes:
      label: Flutter version
      description: Output of `flutter --version` for source builds.
      placeholder: 3.50.0

  - type: textarea
    id: logs
    attributes:
      label: Redacted logs or diagnostics
      description: Paste only redacted text. Remove tokens, PINs, and personal data.
      render: shell

  - type: checkboxes
    id: honesty
    attributes:
      label: Confirmation
      options:
        - label: I removed secrets and personal data from this report.
          required: true
