name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  AURA_ENABLE_LIVE_GROQ_TESTS: 'false'
  AURA_CONFIRM_LIVE_GROQ_CHAT: 'false'

jobs:
  format:
    name: Dart formatting
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Flutter 3.50.0
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true

      - name: Resolve dependencies from lockfile
        run: |
          flutter pub get --enforce-lockfile
          git diff --exit-code -- pubspec.lock

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

  analyze:
    name: Flutter analysis
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Flutter 3.50.0
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true

      - name: Resolve dependencies from lockfile
        run: |
          flutter pub get --enforce-lockfile
          git diff --exit-code -- pubspec.lock

      - name: Analyze
        run: flutter analyze --fatal-infos --fatal-warnings

  test:
    name: Flutter tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Flutter 3.50.0
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true

      - name: Resolve dependencies from lockfile
        run: |
          flutter pub get --enforce-lockfile
          git diff --exit-code -- pubspec.lock

      - name: Run Flutter tests
        run: flutter test --exclude-tags golden

      - name: Run timing-sensitive AI tests serially
        run: >-
          flutter test
          test/ai_provider_abstraction_test.dart
          test/ollama_provider_test.dart
          --concurrency=1

  python-telemetry:
    name: Python telemetry tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install telemetry test dependencies
        run: python -m pip install --disable-pip-version-check -r server/requirements.txt

      - name: Run telemetry tests
        run: python -m unittest discover -s server -p 'test_*.py' -v

  windows-build:
    name: Windows release build
    runs-on: windows-2025-vs2026
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Flutter 3.50.0
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true

      - name: Resolve dependencies from lockfile
        shell: bash
        run: |
          flutter pub get --enforce-lockfile
          git diff --exit-code -- pubspec.lock

      # Strict golden rendering is environment-sensitive. Keep it on the same
      # pinned Windows runner that owns the golden baseline; Linux runs all
      # non-golden Flutter tests.
      - name: Run golden tests
        run: flutter test --tags golden --concurrency=1

      - name: Build Windows release
        run: flutter build windows --release

  android-debug-apk:
    name: Android debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter 3.50.0
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true

      - name: Write ephemeral Android SDK paths
        shell: bash
        run: |
          set -euo pipefail
          SDK_PATH="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [ -z "$SDK_PATH" ]; then
            echo 'Android SDK path is not available on this runner.' >&2
            exit 1
          fi
          {
            echo "sdk.dir=$SDK_PATH"
            echo "flutter.sdk=$FLUTTER_ROOT"
          } > android/local.properties

      - name: Reduce Gradle daemon heap for hosted runner
        shell: bash
        run: |
          sed -i 's/^org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:ReservedCodeCacheSize=512m/' android/gradle.properties

      - name: Resolve dependencies from lockfile
        run: |
          flutter pub get --enforce-lockfile
          git diff --exit-code -- pubspec.lock

      - name: Build Android debug APK
        run: flutter build apk --debug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: aura-hub-debug-apk-not-a-release
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7
          if-no-files-found: error

  pr-gate:
    name: PR gate
    if: always()
    needs:
      - format
      - analyze
      - test
      - python-telemetry
      - windows-build
      - android-debug-apk
    runs-on: ubuntu-latest
    steps:
      - name: Verify required checks
        shell: bash
        run: |
          set -euo pipefail
          for result in ${{ join(needs.*.result, ' ') }}; do
            if [ "$result" != 'success' ]; then
              echo "A required check did not succeed: $result"
              exit 1
            fi
          done
