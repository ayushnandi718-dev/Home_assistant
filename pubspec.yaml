name: aura_hub
description: "AURA Hub - companion and management console for the AURA AI Desk Companion ecosystem."
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  crypto: ^3.0.8
  ffi: ^2.1.0
  flutter_markdown: ^0.7.7+1
  timezone: ^0.11.2
  intl: ^0.20.3
  markdown: ^7.3.1
  http: ^1.6.0
  forui: ^0.28.0

dev_dependencies:
  fake_async: ^1.3.3
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  forui_cli: ^0.28.0

flutter:
  uses-material-design: true
  assets:
    - assets/avatars/
    - assets/images/
